<!doctype html>

<style>
* { box-sizing: border-box; } body { margin: 0; font: 14px/1.5 -apple-system, BlinkMacSystemFont, sans-serif; background: #fff; color: #252525; } aside { width: 280px; height: 100vh; background: #f8f8f8; border-right: 1px solid #ddd; padding: 16px 10px; display: flex; flex-direction: column; } h1 { font-size: 18px; margin: 0 8px 20px; } nav { flex:1; min-height:0; overflow:auto; } nav h2 { font-size:12px; margin:8px; font-weight:500; } [role=list] { display:flex; flex-direction:column; } .sidebar-item { display:flex; align-items:center; padding:9px 8px; min-height:38px; position:relative; } .sidebar-item:hover { background:#eee; } .link-cell { display:flex; align-items:center; min-width:0; flex:1; } .link-cell > div { display:flex; align-items:center; min-width:0; flex:1; } .link-cell a { color:inherit; text-decoration:none; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; flex:1; font-size:12px; } .rail { display:flex; align-items:center; gap:3px; } .rail button { background:none; border:0; padding:3px; cursor:pointer; font-size:12px; } main { position:absolute; left:280px; right:0; top:0; padding:32px; } main h2 { font-size:20px; } select { font:inherit; padding:4px; margin:0 10px 12px 0; } #log { white-space:pre-wrap; font-size:11px; color:#555; } [role=menu] { position:fixed; left:220px; top:120px; z-index:10; background:white; border:1px solid #ccc; padding:7px; min-width:140px; } [role=menuitem] { padding:7px 12px; cursor:pointer; } [role=dialog] { position:fixed; z-index:20; top:30%; left:32%; background:white; border:1px solid #aaa; box-shadow:0 5px 40px #0002; padding:22px; max-width:400px; } [role=dialog] button { padding:7px 12px; margin:8px 8px 0 0; } @media(prefers-color-scheme:dark) { body { color:#eee; background:#212121; } aside { background:#181818; border-color:#444; } .sidebar-item:hover { background:#303030; } .rail button { color:inherit; } [role=menu], [role=dialog] { color:#eee; background:#252525; } } @media(max-width:600px) { aside { width:250px; } main { left:250px; padding:10px; } }

</head><body>
<aside id="sidebar"><h1>ChatGPT 테스트</h1><nav aria-label="홈"><h2>최근</h2><div id="history" role="list"></div></nav></aside>
<main><h2>로컬 가짜 대화</h2><p>실제 계정과 연결되지 않습니다.</p>
<label>언어 <select id="language"><option value="ko">한국어</option><option value="en">English</option></select></label>
<label>상황 <select id="scenario"><option value="normal">정상</option><option value="mismatch">다른 제목</option><option value="substring">일부만 같은 제목</option><option value="unknown">알 수 없는 메뉴</option><option value="stalled">결과 미반영</option><option value="slow">느린 처리</option><option value="wrong-owner">다른 버튼의 메뉴</option><option value="rerender-list">삭제 후 목록 교체</option><option value="rerender-sidebar">삭제 후 사이드바 교체</option><option value="loading-list">목록 교체 후 지연 로딩</option><option value="processing-dialog">삭제 처리 15초</option><option value="processing-dialog-late-close">행 제거 후 확인창 15초</option><option value="pending-forever">삭제 처리 미완료</option><option value="delete-rejected">삭제 요청 거부</option></select></label>
<label>메뉴 열기 <select id="trigger"><option value="pointerdown">pointerdown (현재 화면)</option><option value="click">click (이전 화면)</option></select></label>
